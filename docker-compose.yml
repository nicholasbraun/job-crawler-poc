# Shared log-rotation policy applied to every service. Docker's json-file log
# driver is unbounded by default; an overnight run's logs helped fill the disk
# and stall Redis. Caps each container to ~30 MB of logs (10 MB x 3 files).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  crawler:
    build: .
    logging: *default-logging
    # Memory seatbelt (ADR-0032 follow-up, incident 2026-07-22, #182). The crawler
    # was OOM-killed (SIGKILL/137) when its heap grew into the VM: with no limit the
    # kernel was the only backstop, and the killed run was left stuck `running` with
    # no terminal status. Two knobs, sized for the 6 GiB Docker Desktop VM this
    # stack shares -- Redis (<=2 GB), Postgres, and the Prometheus/Grafana/Loki
    # observability stack together claim ~3.5 GiB, leaving ~2.5 GiB for the crawler:
    #   mem_limit   hard cgroup cap. A runaway now kills only the crawler (contained
    #               blast radius -- Redis/Postgres survive with state intact for
    #               resume), not the whole VM. (An 8 GiB VM could afford 4g.)
    #   GOMEMLIMIT  soft limit Go's GC respects (read natively, no code change), set
    #               to ~83% of mem_limit. As the heap approaches it GC applies
    #               backpressure, turning a transient goquery-worker spike into a
    #               slowdown instead of a kill. Re-derive if mem_limit changes.
    # This complements -- does not replace -- bounding data structures (ADR-0032);
    # it guards the transient reclaimable floor, not a leak. If the crawler ever
    # GC-thrashes at the soft limit, lower CRAWL_MAX_WORKERS or grow the VM.
    mem_limit: 2g
    # Pin swap to the RAM cap (memswap_limit == mem_limit disables container swap)
    # so a runaway is killed cleanly at 2 GiB rather than thrashing into swap: a
    # swapped Go heap hangs on GC page-faults, so kill + resume from preserved
    # Redis/Postgres state is the better failure mode than a hung crawler.
    memswap_limit: 2g
    # If the seatbelt above is still breached -- or the crawler crashes for any
    # other reason -- restart on non-zero exit (137/OOM included) so a transient
    # spike self-heals instead of leaving the service down with runs stuck
    # `running` (the 2026-07-22 failure mode). on-failure, not always/
    # unless-stopped: a deliberate `compose down` stays down and a clean exit is
    # not resurrected. Caveat: runner Reconcile auto-resumes the `running` run
    # from Redis on boot, so a run that genuinely cannot fit in mem_limit will
    # crash-loop -- mark it failed or stop the container to break the loop.
    # (docker compose honors this field; deploy.restart_policy max_attempts is
    # swarm-only, so retries cannot be capped here.)
    restart: on-failure
    ports:
      - "8080:8080"
    # Forward external DNS to fast public resolvers instead of the embedded
    # 127.0.0.11 default upstream. A discovery crawl resolves thousands of new
    # hosts, and the embedded resolver throttles that load (it becomes the
    # throughput ceiling under concurrency). Service names (redis, postgres) still
    # resolve via the embedded DNS, which forwards only external queries here.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Restore host.docker.internal, which the dns: override above breaks. Docker
    # Desktop serves that name from the embedded resolver, and replacing the
    # nameserver list drops it -- so an LLM_BASE_URL pointing at a model server on
    # the host (a local Ollama/unsloth on :8888) fails every classify/extract call
    # with "no such host", and the llmstream leaves the tasks pending. Pinning the
    # name to host-gateway brings it back without giving up the fast external
    # resolvers the discovery crawl needs.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Soft heap ceiling Go's GC respects (~83% of mem_limit above). See the
      # memory-seatbelt comment on mem_limit for rationale and re-derivation.
      - GOMEMLIMIT=1700MiB
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - LLM_MAX_WORKERS=${LLM_MAX_WORKERS}
      # Prompt-window caps (what the model READS) and the stored Posting Body cap (what
      # the Corpus KEEPS, ADR-0041) are separate knobs; all three must be listed here or
      # tuning them in .env has no effect on the container. The ":-" spelling expands an
      # unset var to "" WITHOUT a compose warning, and env.EnvOr reads "" as "use the
      # built-in default" — so the default stays defined once, in Go, not duplicated here.
      - LLM_CLASSIFY_MAX_CHARS=${LLM_CLASSIFY_MAX_CHARS:-}
      - LLM_EXTRACT_MAX_CHARS=${LLM_EXTRACT_MAX_CHARS:-}
      - DESCRIPTION_MAX_CHARS=${DESCRIPTION_MAX_CHARS:-}
      # Free Extraction kill switch (ADR-0042). Listed here so the dial works under
      # Docker; ":-" expands an unset var to "" and env.EnvOr reads "" as the
      # built-in default (true), keeping the default defined once, in Go.
      - EXTRACT_FROM_JSONLD=${EXTRACT_FROM_JSONLD:-}
      # Shadow Extraction sampling rate (ADR-0044). Listed here so the dial works
      # under Docker; ":-" expands an unset var to "" and env.EnvOr reads "" as the
      # built-in default (0.01), keeping the default defined once, in Go.
      - SHADOW_EXTRACT_RATE=${SHADOW_EXTRACT_RATE:-}
      # Extract Gate Positive Evidence kill switch (ADR-0044). Listed here so the dial
      # works under Docker; ":-" expands an unset var to "" and env.EnvOr reads "" as
      # the built-in default (true), keeping the default defined once, in Go.
      - EXTRACT_REQUIRE_POSITIVE_EVIDENCE=${EXTRACT_REQUIRE_POSITIVE_EVIDENCE:-}
      # Learned Veto kill switch (ADR-0049), the Extract Gate's last rung. Listed here so
      # the flip AND the back-out are one variable under Docker -- the README's rollout
      # runbook promises exactly that; ":-" expands an unset var to "" and env.EnvOr reads
      # "" as the built-in default (false), keeping the default defined once, in Go.
      - EXTRACT_LEARNED_VETO=${EXTRACT_LEARNED_VETO:-}
      # Structural Rendering kill switch (ADR-0046). Listed here so the dial works
      # under Docker; ":-" expands an unset var to "" and env.EnvOr reads "" as the
      # built-in default (false), keeping the default defined once, in Go.
      - PARSE_STRUCTURAL_RENDERING=${PARSE_STRUCTURAL_RENDERING:-}
      - CRAWL_MAX_WORKERS=${CRAWL_MAX_WORKERS:-50}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgres://crawler:crawler@postgres:5432/crawler?sslmode=disable
      - REDIS_ADDR=redis:6379
    depends_on:
      - loki
      - postgres
      - redis
    labels:
      - "app=job-crawler"

  redis:
    image: redis:7
    logging: *default-logging
    # Redis holds only transient crawl state (frontier queues, visited set,
    # leases); the durable data is in Postgres. Two guards keep the growing state
    # (see #75) from taking the stack down:
    #   --save ""          disable RDB snapshots. Removes both the on-disk growth
    #                      that filled the disk and the periodic fork memory spikes
    #                      that OOM-killed Redis. Trade-off: a Redis *process*
    #                      restart loses the frontier (a paused run can't resume
    #                      across it); in-process pause/resume is unaffected.
    #   --maxmemory 2gb    cap Redis below the VM so it rejects writes and stays
    #   --maxmemory-policy alive (crawl stalls recoverably, state preserved) instead
    #     noeviction       of the kernel OOM-killing it (container dies, all state
    #                      lost, silent stall). noeviction because frontier data
    #                      can't be evicted without corrupting the crawl.
    command:
      - redis-server
      - --save
      - ""
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    logging: *default-logging
    environment:
      - POSTGRES_USER=crawler
      - POSTGRES_PASSWORD=crawler
      - POSTGRES_DB=crawler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    logging: *default-logging
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:latest
    logging: *default-logging
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    logging: *default-logging
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
